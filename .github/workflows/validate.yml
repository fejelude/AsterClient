name: Repository validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/bootstrap.py --verify-only
      - run: python -m unittest discover -s tests -p '*_tests.py' -v
      - run: cmake -S . -B build-portable -DASTER_PORTABLE_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-portable --parallel 2
      - run: ctest --test-dir build-portable --output-on-failure
      - run: node --test service/tests.mjs

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/bootstrap.py --verify-only
      - run: python -m unittest discover -s tests -p '*_tests.py' -v
      - run: cmake --preset windows-x64
      - run: cmake --build --preset release --parallel 4
      - run: ctest --preset release
      - run: node --test service/tests.mjs
        env:
          ASTER_REQUIRE_NATIVE_TESTS: '1'
      - name: Package and smoke-test the installed application
        shell: pwsh
        run: |
          $package = & ./tools/package.ps1
          $executable = Join-Path $package.Folder 'AsterClient.exe'
          $profile = Join-Path $PWD 'build/smoke/profiles/default.json'
          $process = Start-Process -FilePath $executable -ArgumentList @('--profile', $profile, '--smoke-seconds', '2') -PassThru
          if (-not $process.WaitForExit(20000)) { $process.Kill(); throw 'Packaged UI startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged UI exited with $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $profile)) { throw 'Smoke test did not save its isolated profile' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            dist/*.zip
            dist/*.sha256
            build/Testing/Temporary/LastTest.log
            build/test-results/**/results.json
            test-results/**/results.json
          if-no-files-found: warn
